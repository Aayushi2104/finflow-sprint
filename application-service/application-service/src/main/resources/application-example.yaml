spring:
  application:
    name: application-service
  datasource:
    url: "jdbc:mysql://localhost:3306/finflow_app_db?createDatabaseIfNotExist=true"
    username: "your-db-username"
    password: "your-db-password"
    driver-class-name: "com.mysql.cj.jdbc.Driver"
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  jwt:
    secret: "your-jwt-secret"
    expiration: 86400000

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
