server:
  port: 8086

spring:
  application:
    name: admin-service

  datasource:
    url: "jdbc:mysql://localhost:3306/finflow_admin_db?createDatabaseIfNotExist=true"
    username: "your-db-username"
    password: "your-db-password"
    driver-class-name: "com.mysql.cj.jdbc.Driver"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

jwt:
  secret: "your-jwt-secret"

services:
  application-service:
    url: http://localhost:8082
  auth-service:
    url: http://localhost:8081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
